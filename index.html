<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>PowderBox — Particle Sandbox</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      :root {
        --bg: #0d0d17;
        --surface: #161625;
        --surface2: #1e1e30;
        --border: #2a2a3e;
        --text: #e0e0e8;
        --text2: #999;
        --accent: #f7c948;
        --accent-glow: rgba(247,201,72,0.2);
      }
      body {
        background: var(--bg);
        color: var(--text);
        font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        min-height: 100dvh;
        padding: 0.5rem;
        user-select: none;
        -webkit-user-select: none;
        -webkit-tap-highlight-color: transparent;
        overflow-x: hidden;
      }

      /* ─── Header ─── */
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        width: 100%;
        max-width: 972px;
        padding: 0.4rem 0.25rem;
        gap: 0.5rem;
        flex-shrink: 0;
      }
      .logo {
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }
      .logo-icon {
        font-size: 1.5rem;
        line-height: 1;
      }
      h1 {
        font-size: 1.2rem;
        font-weight: 700;
        background: linear-gradient(135deg, #ff6b35, #f7c948, #4ecdc4);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        letter-spacing: -0.02em;
        white-space: nowrap;
      }
      h1 small {
        -webkit-text-fill-color: var(--text2);
        font-weight: 400;
        font-size: 0.65rem;
        margin-left: 0.3rem;
      }
      .status {
        font-size: 0.75rem;
        color: var(--text2);
        display: flex;
        align-items: center;
        gap: 0.5rem;
        flex-wrap: wrap;
        justify-content: flex-end;
      }
      .status-badge {
        background: var(--surface2);
        border: 1px solid var(--border);
        border-radius: 4px;
        padding: 0.15rem 0.45rem;
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }
      .recording-badge {
        color: #ff4444;
        animation: pulse 0.8s ease-in-out infinite;
      }
      @keyframes pulse { 50% { opacity: 0.4; } }

      /* ─── Canvas ─── */
      .canvas-wrap {
        width: 100%;
        max-width: 972px;
        border-radius: 10px;
        border: 1px solid var(--border);
        background: var(--surface);
        overflow: hidden;
        flex-shrink: 0;
        position: relative;
      }
      .canvas-wrap canvas {
        display: block;
        width: 100%;
        height: auto;
        aspect-ratio: 960 / 600;
        cursor: crosshair;
        image-rendering: pixelated;
        touch-action: none;
      }
      .canvas-overlay {
        position: absolute;
        inset: 0;
        pointer-events: none;
        border-radius: 10px;
        box-shadow: inset 0 0 60px rgba(0,0,0,0.3);
      }

      /* ─── Toolbar ─── */
      .toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 0.25rem;
        align-items: center;
        width: 100%;
        max-width: 972px;
        margin-top: 0.5rem;
        padding: 0.4rem 0.5rem;
        background: var(--surface);
        border-radius: 10px;
        border: 1px solid var(--border);
        flex-shrink: 0;
      }
      .toolbar-row {
        display: flex;
        flex-wrap: wrap;
        gap: 0.25rem;
        align-items: center;
        flex: 1;
        min-width: 0;
      }
      .tool-btn {
        width: 38px; height: 38px;
        border: 2px solid transparent;
        border-radius: 8px;
        cursor: pointer;
        position: relative;
        transition: all 0.1s;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.1rem;
        background: var(--surface2);
        flex-shrink: 0;
      }
      .tool-btn:active { transform: scale(0.92); }
      .tool-btn.active {
        border-color: var(--accent);
        box-shadow: 0 0 10px var(--accent-glow);
        background: #2a2a3e;
      }
      .swatch {
        display: inline-block;
        width: 18px;
        height: 18px;
        border-radius: 4px;
        box-shadow: inset 0 1px 2px rgba(0,0,0,0.3), 0 0 4px rgba(255,255,255,0.05);
      }
      .eraser-swatch {
        background: transparent !important;
        border: 1px dashed var(--text2);
        color: var(--text2);
        font-size: 0.8rem;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: none;
      }
      .tool-shortcut {
        position: absolute;
        top: -2px; right: -2px;
        font-size: 0.5rem;
        color: var(--text2);
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 3px;
        padding: 0 2px;
        line-height: 1.2;
        pointer-events: none;
      }

      .tool-label {
        display: none;
      }

      .separator {
        width: 1px; height: 30px;
        background: var(--border);
        flex-shrink: 0;
        margin: 0 0.2rem;
      }

      /* Brush control */
      .brush-group {
        display: flex;
        align-items: center;
        gap: 0.3rem;
        flex-shrink: 0;
        padding: 0 0.2rem;
      }
      .brush-group label {
        font-size: 0.7rem;
        color: var(--text2);
      }
      .brush-group button {
        width: 26px; height: 26px;
        border: 1px solid var(--border);
        border-radius: 5px;
        background: var(--surface2);
        color: var(--text);
        font-size: 0.9rem;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .brush-group button:active { background: #333; }
      .brush-count {
        min-width: 22px;
        text-align: center;
        font-variant-numeric: tabular-nums;
        font-weight: 600;
        font-size: 0.85rem;
      }

      /* Action buttons */
      .actions {
        display: flex;
        gap: 0.25rem;
        margin-left: auto;
        flex-shrink: 0;
      }
      .action-btn {
        padding: 0.3rem 0.6rem;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: var(--surface2);
        color: var(--text);
        cursor: pointer;
        font-size: 0.75rem;
        transition: all 0.1s;
        white-space: nowrap;
        display: flex;
        align-items: center;
        gap: 0.3rem;
      }
      .action-btn:active { transform: scale(0.95); }
      .action-btn.record { color: #ff6b6b; }
      .action-btn.record.active { background: #4a2020; border-color: #ff6b6b; }
      .action-btn.clear { color: #e88; }
      .action-btn.generate { 
        background: linear-gradient(135deg, #2a1a3e, #1e2a3e);
        border-color: #7c5cbf;
        color: #c8a8ff;
        box-shadow: 0 0 6px rgba(124,92,191,0.2);
        transition: all 0.15s;
      }
      .action-btn.generate:hover { 
        border-color: #a07cff; 
        background: linear-gradient(135deg, #3a2a4e, #2e3a4e);
        box-shadow: 0 0 12px rgba(124,92,191,0.4);
      }
      .action-btn.generate:active { 
        transform: scale(0.92);
      }

      /* ─── Scene name toast ─── */
      .scene-toast {
        position: absolute;
        bottom: 8px; left: 8px;
        color: rgba(255,255,255,0.85);
        font-size: 0.68rem;
        font-weight: 500;
        letter-spacing: 0.03em;
        pointer-events: none;
        text-shadow: 0 1px 4px rgba(0,0,0,0.9);
        opacity: 0;
        transition: opacity 0.6s ease;
        z-index: 5;
        background: rgba(0,0,0,0.3);
        padding: 3px 8px;
        border-radius: 4px;
        backdrop-filter: blur(2px);
      }
      .scene-toast.visible { opacity: 1; }

      /* ─── Scene transition animation ─── */
      @keyframes sceneFlash {
        0% { opacity: 1; }
        20% { opacity: 0.2; filter: brightness(2); }
        40% { opacity: 0.4; }
        100% { opacity: 1; filter: brightness(1); }
      }
      .canvas-wrap.scene-transition {
        animation: sceneFlash 0.35s ease-out;
      }

      /* ─── Confirmation modal ─── */
      .confirm-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,0.6);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 100;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.25s;
      }
      .confirm-overlay.visible {
        opacity: 1;
        pointer-events: all;
      }
      .confirm-box {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 1.5rem;
        max-width: 360px;
        text-align: center;
        box-shadow: 0 8px 40px rgba(0,0,0,0.5);
      }
      .confirm-box h3 {
        font-size: 1rem;
        margin-bottom: 0.5rem;
        color: var(--accent);
      }
      .confirm-box p {
        font-size: 0.8rem;
        color: var(--text2);
        margin-bottom: 1rem;
        line-height: 1.4;
      }
      .confirm-btns {
        display: flex;
        gap: 0.5rem;
        justify-content: center;
      }
      .confirm-btns button {
        padding: 0.4rem 1rem;
        border-radius: 6px;
        border: 1px solid var(--border);
        cursor: pointer;
        font-size: 0.8rem;
        transition: all 0.1s;
      }
      .confirm-btns .confirm-yes {
        background: linear-gradient(135deg, #7c5cbf, #5c3c9f);
        color: white;
        border-color: #7c5cbf;
      }
      .confirm-btns .confirm-yes:hover { background: linear-gradient(135deg, #8c6ccf, #6c4caf); }
      .confirm-btns .confirm-no {
        background: var(--surface2);
        color: var(--text);
      }
      .confirm-btns .confirm-no:hover { background: #333; }

      /* ─── Legend / Shortcuts ─── */
      .legend {
        width: 100%;
        max-width: 972px;
        margin-top: 0.4rem;
        font-size: 0.65rem;
        color: var(--text2);
        text-align: center;
        line-height: 1.5;
        flex-shrink: 0;
      }
      .legend kbd {
        display: inline-block;
        background: var(--surface2);
        border: 1px solid var(--border);
        border-radius: 3px;
        padding: 0 4px;
        font-family: inherit;
        font-size: 0.6rem;
        color: var(--text);
      }

      /* ─── Mobile tweaks ─── */
      @media (max-width: 600px) {
        body { padding: 0.25rem; gap: 0; }
        header { padding: 0.25rem 0; }
        h1 { font-size: 1rem; }
        h1 small { display: none; }
        .status { font-size: 0.65rem; }
        .toolbar { padding: 0.3rem; gap: 0.2rem; }
        .tool-btn { width: 34px; height: 34px; font-size: 1rem; }
        .tool-shortcut { display: none; }
        .actions .action-btn { font-size: 0.65rem; padding: 0.25rem 0.4rem; }
        .brush-group label { display: none; }
        .separator { height: 24px; }
        .legend { font-size: 0.55rem; }
      }
      @media (max-width: 420px) {
        .tool-btn { width: 30px; height: 30px; font-size: 0.85rem; }
      }
    </style>
  </head>
  <body>
    <!-- ═══ Header ═══ -->
    <header>
      <div class="logo">
        <span class="logo-icon">🧪</span>
        <h1>PowderBox <small>particle sandbox</small></h1>
      </div>
      <div class="status">
        <span class="status-badge brush-info" id="status-brush">Brush: <span id="status-size">3</span></span>
        <span class="status-badge" id="status-tool">Sand</span>
      </div>
    </header>

    <!-- ═══ Canvas ═══ -->
    <div class="canvas-wrap">
      <canvas id="sim-canvas"></canvas>
      <div class="canvas-overlay"></div>
      <div class="scene-toast" id="scene-name"></div>
    </div>

    <!-- ═══ Toolbar ═══ -->
    <div class="toolbar">
      <div class="toolbar-row" id="tool-row">
        <button class="tool-btn" id="tool-sand" title="Sand (1)"><span class="swatch" style="background:#d4a574"></span><span class="tool-shortcut">1</span></button>
        <button class="tool-btn" id="tool-water" title="Water (2)"><span class="swatch" style="background:#3498db"></span><span class="tool-shortcut">2</span></button>
        <button class="tool-btn" id="tool-fire" title="Fire (3)"><span class="swatch" style="background:#ff5722"></span><span class="tool-shortcut">3</span></button>
        <button class="tool-btn" id="tool-wall" title="Wall (4)"><span class="swatch" style="background:#64646e"></span><span class="tool-shortcut">4</span></button>
        <button class="tool-btn" id="tool-wood" title="Wood (5)"><span class="swatch" style="background:#8b4513"></span><span class="tool-shortcut">5</span></button>
        <button class="tool-btn" id="tool-oil" title="Oil (6)"><span class="swatch" style="background:#50461e"></span><span class="tool-shortcut">6</span></button>
        <button class="tool-btn" id="tool-plant" title="Plant (7)"><span class="swatch" style="background:#2e7d32"></span><span class="tool-shortcut">7</span></button>
        <button class="tool-btn" id="tool-lava" title="Lava (8)"><span class="swatch" style="background:#ff4500"></span><span class="tool-shortcut">8</span></button>
        <button class="tool-btn" id="tool-acid" title="Acid (9)"><span class="swatch" style="background:#00ff00"></span><span class="tool-shortcut">9</span></button>
        <button class="tool-btn" id="tool-eraser" title="Eraser (0)"><span class="swatch eraser-swatch">✕</span><span class="tool-shortcut">0</span></button>

        <div class="separator"></div>

        <div class="brush-group">
          <label>Brush</label>
          <button id="brush-decrease" title="Decrease brush (—)">−</button>
          <span class="brush-count" id="brush-size-display">3</span>
          <button id="brush-increase" title="Increase brush (=)">+</button>
        </div>
      </div>

      <div class="actions">
        <button class="action-btn generate" id="btn-generate" title="Generate random scene (N)">🎲 Scene</button>
        <button class="action-btn" id="btn-save" title="Save canvas (Ctrl+S)">💾 Save</button>
        <button class="action-btn" id="btn-load" title="Load canvas (Ctrl+O)">📂 Load</button>
        <input type="file" id="load-input" accept=".pbox" style="display:none">
        <div class="separator"></div>
        <button class="action-btn" id="btn-explode" title="Explosion tool (E)">💥</button>
        <button class="action-btn" id="btn-wind" title="Toggle wind (W)">🌬️ Off</button>
        <button class="action-btn" id="btn-gravity" title="Flip gravity">🔄 ↓</button>
        <div class="separator"></div>
        <button class="action-btn record" id="btn-record" title="Record GIF (G)">🎬 GIF</button>
        <button class="action-btn clear" id="btn-clear" title="Clear all (C)">✕ Clear</button>
      </div>
    </div>

    <!-- ═══ Legend ═══ -->
    <p class="legend">
      <kbd>1</kbd>–<kbd>9</kbd> tools 
      <kbd>0</kbd> eraser 
      <kbd>−</kbd>/<kbd>=</kbd> brush 
      <kbd>N</kbd> scene <kbd>←</kbd><kbd>→</kbd> cycle 
      <kbd>E</kbd> explode <kbd>W</kbd> wind 
      <kbd>G</kbd> GIF 
      <kbd>C</kbd> clear 
      <kbd>Space</kbd> pause 
      Drag to draw
    </p>

    <!-- ═══ Confirmation modal ═══ -->
    <div class="confirm-overlay" id="confirm-overlay">
      <div class="confirm-box">
        <h3>🧹 Generate new scene?</h3>
        <p>You've made changes to the canvas. Generating a new scene will replace everything. Undo is not supported.</p>
        <div class="confirm-btns">
          <button class="confirm-yes" id="confirm-yes">🎲 Generate</button>
          <button class="confirm-no" id="confirm-no">Cancel</button>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
